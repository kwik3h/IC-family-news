<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Coordinate Tool</title>
    <style>
        :root {
            --bg-color: #121824;
            --card-bg: #1e293b;
            --border-color: #334155;
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 2rem;
            color: var(--text-color);
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            color: var(--text-color);
        }

        .tab-btn.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }

        .tab-content {
            display: none;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }

        .tab-content.active {
            display: block;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-color);
        }

        textarea {
            width: 100%;
            height: 220px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            padding: 12px;
            font-family: monospace;
            font-size: 0.95rem;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        button.btn {
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button.btn:hover {
            background-color: var(--primary-hover);
        }

        button.btn-secondary {
            background-color: var(--border-color);
            color: var(--text-color);
        }

        button.btn-secondary:hover {
            background-color: #475569;
        }

        button.btn-danger {
            background-color: var(--danger-color);
        }

        button.btn-danger:hover {
            background-color: #dc2626;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--input-bg);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .copied-toast {
            color: var(--success-color);
            font-weight: 600;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Game Coordinate Parser & Matcher</h1>
        <p>Extract, clean, match, or subtract game coordinates (Format: X,Y:Z)</p>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('cleaner')">Clean Raw Text</button>
        <button class="tab-btn" onclick="switchTab('matcher')">Compare 2 Lists</button>
    </div>

    <!-- TAB 1: CLEANER -->
    <div id="cleaner" class="tab-content active">
        <div class="grid-2">
            <div class="form-group">
                <label for="cleaner-input">Paste Raw Game Text / Logs:</label>
                <textarea id="cleaner-input" placeholder="Paste uncleaned game output here...&#10;e.g. 24,9:1 147 (147) / 147&#10;3 Laser 1 turns 51,2:1 Cancel"></textarea>
            </div>
            <div class="form-group">
                <label for="cleaner-output">Cleaned Coordinates:</label>
                <textarea id="cleaner-output" readonly placeholder="Extracted coordinates will appear here..."></textarea>
            </div>
        </div>

        <div class="actions">
            <button class="btn" onclick="processCleaner()">Clean Coordinates</button>
            <button class="btn btn-secondary" onclick="copyOutput('cleaner-output', 'cleaner-toast')">Copy Output</button>
            <button class="btn btn-secondary" onclick="clearCleaner()">Clear All</button>
        </div>

        <div class="status-bar">
            <span id="cleaner-stats">Found: 0 coordinates</span>
            <span id="cleaner-toast" class="copied-toast">Copied to clipboard!</span>
        </div>
    </div>

    <!-- TAB 2: MATCHER -->
    <div id="matcher" class="tab-content">
        <div class="grid-2">
            <div class="form-group">
                <label for="matcher-list-a">List A (Primary List):</label>
                <textarea id="matcher-list-a" placeholder="Paste first list of coordinates or raw text..."></textarea>
            </div>
            <div class="form-group">
                <label for="matcher-list-b">List B (Secondary List):</label>
                <textarea id="matcher-list-b" placeholder="Paste second list of coordinates or raw text..."></textarea>
            </div>
        </div>

        <div class="actions">
            <button class="btn" onclick="processMatcher('intersection')">Find Matching (In Both Lists)</button>
            <button class="btn btn-danger" onclick="processMatcher('difference')">Remove List B from List A</button>
            <button class="btn btn-secondary" onclick="copyOutput('matcher-output', 'matcher-toast')">Copy Output</button>
            <button class="btn btn-secondary" onclick="clearMatcher()">Clear All</button>
        </div>

        <div class="form-group">
            <label for="matcher-output">Result:</label>
            <textarea id="matcher-output" readonly placeholder="Comparison results will appear here..."></textarea>
        </div>

        <div class="status-bar">
            <span id="matcher-stats">Result count: 0</span>
            <span id="matcher-toast" class="copied-toast">Copied to clipboard!</span>
        </div>
    </div>
</div>

<script>
    // Tab Switching
    function switchTab(tabId) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

        if (tabId === 'cleaner') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('cleaner').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('matcher').classList.add('active');
        }
    }

    // Helper: Extract unique coordinates using Regex matching X,Y:Z
    function extractCoordinates(text) {
        if (!text) return [];
        const regex = /\b\d+,\d+:\d+\b/g;
        const matches = text.match(regex);
        if (!matches) return [];
        // Remove duplicates while preserving original order
        return [...new Set(matches)];
    }

    // Process Cleaner
    function processCleaner() {
        const input = document.getElementById('cleaner-input').value;
        const coords = extractCoordinates(input);
        
        document.getElementById('cleaner-output').value = coords.join('\n');
        document.getElementById('cleaner-stats').innerText = `Found: ${coords.length} unique coordinates`;
    }

    // Process Matcher (Intersection or Difference)
    function processMatcher(mode) {
        const textA = document.getElementById('matcher-list-a').value;
        const textB = document.getElementById('matcher-list-b').value;

        const coordsA = extractCoordinates(textA);
        const coordsB = extractCoordinates(textB);
        const setB = new Set(coordsB);

        let result = [];

        if (mode === 'intersection') {
            // Find items present in BOTH List A and List B
            result = coordsA.filter(coord => setB.has(coord));
        } else if (mode === 'difference') {
            // Remove List B items from List A
            result = coordsA.filter(coord => !setB.has(coord));
        }

        document.getElementById('matcher-output').value = result.join('\n');
        document.getElementById('matcher-stats').innerText = `Result count: ${result.length} coordinates`;
    }

    // Copy Output to Clipboard
    function copyOutput(elementId, toastId) {
        const textarea = document.getElementById(elementId);
        if (!textarea.value) return;

        navigator.clipboard.writeText(textarea.value).then(() => {
            const toast = document.getElementById(toastId);
            toast.style.display = 'inline';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 2000);
        });
    }

    // Clear Inputs
    function clearCleaner() {
        document.getElementById('cleaner-input').value = '';
        document.getElementById('cleaner-output').value = '';
        document.getElementById('cleaner-stats').innerText = 'Found: 0 coordinates';
    }

    function clearMatcher() {
        document.getElementById('matcher-list-a').value = '';
        document.getElementById('matcher-list-b').value = '';
        document.getElementById('matcher-output').value = '';
        document.getElementById('matcher-stats').innerText = 'Result count: 0';
    }
</script>

</body>
</html>
